name: Deploy KE Frontend

on:
  push:
    branches:
      - test
      - main

  pull_request:
    branches:
      - test
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to TEST
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        run: |
          sudo mkdir -p /var/www/keonline-test
          sudo rm -rf /var/www/keonline-test/*
          sudo cp -r dist/* /var/www/keonline-test/
          sudo chown -R www-data:www-data /var/www/keonline-test

      - name: Deploy to PROD
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sudo mkdir -p /var/www/keonline-prod
          sudo rm -rf /var/www/keonline-prod/*
          sudo cp -r dist/* /var/www/keonline-prod/
          sudo chown -R www-data:www-data /var/www/keonline-prod

      - name: Validate and reload nginx
        if: github.event_name == 'push'
        run: |
          sudo nginx -t
          sudo systemctl reload nginx
