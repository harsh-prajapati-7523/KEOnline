name: Deploy KE Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Go to frontend repo
        run: |
          cd ~/apps/KEOnline
          git pull

      - name: Install dependencies
        run: |
          cd ~/apps/KEOnline
          npm install

      - name: Build frontend
        run: |
          cd ~/apps/KEOnline
          npm run build

      - name: Deploy dist files
        run: |
          sudo rm -rf /var/www/KEOnline/*
          sudo cp -r ~/apps/KEOnline/dist/* /var/www/KEOnline/

      - name: Restart nginx
        run: sudo systemctl restart nginx
